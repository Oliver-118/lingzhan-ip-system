version: '3.8'

services:
  lingzhan-ip:
    build: .
    container_name: lingzhan-ip-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 数据持久化：数据库 + 上传文件
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/lingzhan.db
      - UPLOAD_DIR=/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
